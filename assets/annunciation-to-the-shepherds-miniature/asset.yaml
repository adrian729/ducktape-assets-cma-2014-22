# descriptive: find it and understand it
id: annunciation-to-the-shepherds-miniature
title: Annunciation to the Shepherds, framed miniature
description: The whole arched miniature of the leaf. In the upper lobe an angel in a red robe flies to the left on a bank of blue and white clouds under a deep blue sky with gold stars, holding a blank white scroll; a gold, red and blue diaper ground fills the spandrels. Below, four shepherds in red, blue and pink hooded tunics stand on a green meadow before a dark hill with two green trees and look up, a white dog leaps between them and two white sheep graze; a pink rock rises at the left. A gold and blue painted frame with an arched top encloses the scene. Opaque inside the frame, transparent outside.
