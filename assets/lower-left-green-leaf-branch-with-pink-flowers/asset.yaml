id: lower-left-green-leaf-branch-with-pink-flowers
title: Leafy branch with pink trumpet flowers
description: The bottom-left corner plant of the border. Slender green stems with oval leaves fan up and to the right and carry four pink trumpet-shaped flowers with fringed, darker pink rims on green calyxes; a smaller leafy shoot sits at the bottom left. The paint is thin, with the parchment tone showing through the green; the background is transparent.
