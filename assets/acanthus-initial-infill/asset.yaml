# descriptive: find it and understand it
id: acanthus-initial-infill
title: Red and violet acanthus infill of an initial
description: The painted infill of a decorated initial from the text, a two-lobed field shaped like a B and outlined by a thin blue band. Inside it blue stems coil through both lobes and throw off red and violet acanthus leaves with cream-white folded tips, with the spaces between the leaves open. The letter stroke, its square field and the gold ground are removed; the background is transparent.
