id: announcing-angel-with-blank-scroll
title: Angel on clouds with a blank scroll
description: An angel with blond hair and a gold halo flies to the left on a bank of blue clouds edged in white, in a red robe, with long red wings sweeping back to the right over white feathered underwings, and holds a large blank white scroll that curls down in front of the clouds. Cut from the upper lobe of the miniature; the starry sky is removed and the background is transparent.
