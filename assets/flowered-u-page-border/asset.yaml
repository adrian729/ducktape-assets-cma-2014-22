usage_notes:
  - Fixed page border scaled as a whole; it is open at the top, so a heading or picture goes in the gap and text inside the U. It is not a border-image, the four corners all differ and the chains are not evenly spaced.
  - For a cornflower chain at any length use blue-cup-and-burst-flowers-on-stem; the four corner plants, the margin scroll and the two small blooms are supplied as separate cut-outs.
