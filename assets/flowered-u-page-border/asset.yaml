# descriptive: find it and understand it
id: flowered-u-page-border
title: Flowered U-shaped page border with gold ivy
description: The complete painted border of the leaf, open at the top where the miniature sat. Two vertical chains of blue cornflowers on a green stem are joined by a third along the bottom, over a loose ground of gold ivy leaves and dots on fine black penwork. Large plants fill the corners, a red and blue acanthus with a gold bird at the top left, a pot of pink flowers at the top right, a leafy pink-flowered branch at the bottom left and a clump of blue cornflowers at the bottom right; a gray-blue acanthus scroll and a second red acanthus grow from the left margin. Centre and background are transparent.
