id: left-gray-blue-acanthus-scroll-with-green-stem
title: Gray-blue acanthus scroll with a pink bud
description: A tall acanthus sprig from the left margin of the border. A gray-blue stem rises from a round pink bud at the bottom, which sprouts a short green stalk to the right, and curls twice to the right into dotted gray-blue scrolls, each carrying a green leaf. The stem is cut flat at the left where the page was trimmed; the background is transparent.
