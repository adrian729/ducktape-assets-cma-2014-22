id: upper-right-pink-flowers-on-green-leaf-sprays
title: Potted plant with pink four-petalled flowers
description: The top-right corner plant of the border. A bushy plant of long, ribbed green leaves spreads from an orange-red pot and carries four pinkish-violet four-petalled flowers along the top and a pink bud at the right; under the pot a blue cornflower bloom marks where the border's vertical chain begins. The green is thin and speckled with the parchment tone; the background is transparent.
