# descriptive: find it and understand it
id: blue-cornflower-chain-tile
title: Blue cornflower chain, repeat tile
description: One cycle of the cornflower chain that forms the vertical stems of the border. A blue fan-shaped bloom seen from the side sits above a round blue bloom seen from the front, both with pale-blue ribbed petals, threaded on a green stem that runs through the tile from top to bottom. The stem continues across the top and bottom edges; the background is transparent.
type: border
categories:
  - floral
  - botanical
subjects:
  - cornflower
  - flower
  - stem
colors:
  - blue
  - green
facing: none
composition: repeat-tile

