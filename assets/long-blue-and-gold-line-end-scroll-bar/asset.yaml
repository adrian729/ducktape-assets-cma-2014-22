# descriptive: find it and understand it
id: long-blue-and-gold-line-end-scroll-bar
title: Blue and gold line filler, long
description: A long horizontal line filler from the text, a worn band of gold leaf over a strip of blue paint with small curled hooks at the ends, made of three short segments set end to end with narrow gaps between them. The gold is cracked and partly bare and the blue mottled, as painted; the background is transparent.
type: divider
