id: lower-right-green-leaf-branch-with-blue-flowers
title: Clump of blue cornflowers on tall stems
description: The bottom-right corner plant of the border, a clump of blue cornflowers. Five fringed blue blooms, three seen from the side and two from the front, one with a small yellow centre, grow on tall green stems with narrow leaves and two green buds, rising from a mound of grass at the bottom. The paint is thin, with the parchment tone showing through the green; the background is transparent.
