title: Four shepherds with a dog and two sheep
description: Four shepherds stand in a close group looking up at the sky. From the left, a bearded man in a blue hood and red tunic with a staff over his shoulder, a youth in a pink tunic, a man in a red hood and blue tunic holding a long staff, and a bearded man in a blue hood and red tunic striped in gold, leaning on a crook and gesturing. A white dog leaps up between them and two white sheep graze at their feet; hose in blue, red and pink, black shoes. Cut from the miniature; the meadow and hill are removed and the background is transparent.
