# descriptive: find it and understand it
id: upper-left-red-and-blue-acanthus-branch
title: Red and blue acanthus branch with a gold bird
description: The top-left corner plant of the border. From a pink bud with a blue calyx at the bottom, red and blue acanthus stems fan upward and out to both sides, their leaves curling into dotted scrolls, the right-hand stem ending in a green knot with a red tip. A small gold bird perches on the left stem facing left. The paint is thick and speckled; the leftmost leaves are cut flat at the trimmed page edge. The background is transparent.
